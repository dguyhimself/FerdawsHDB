<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>شفاخانه تخصصی فردوس | Ferdows Specialized Hospital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfdf5',
              100: '#d1fae5',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
              900: '#064e3b'

          }
        }
      }
    };
  </script>
  <style>
    html[lang="fa"] body { font-family: 'Vazirmatn', sans-serif; }

    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }
    .fade-in { animation: fadeIn 0.2s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    @media print {
      body * { visibility: hidden !important; }
      #print-area, #print-area * { visibility: visible !important; }
      #print-area { position: absolute !important; left: 0 !important; top: 0 !important; width: 100% !important; padding: 24px !important; background: white !important; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-brand-100 selection:text-brand-900">

  <!-- Toast Container -->
  <div id="toast-container" class="fixed bottom-5 end-5 z-[100] flex flex-col gap-2 max-w-sm"></div>

  <!-- Top Global Header -->
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-slate-200 shadow-sm">
    <div class="bg-brand-900 text-white text-xs py-1.5 px-4 hidden md:block">
      <div class="max-w-7xl mx-auto flex items-center justify-between">
        <div class="flex items-center gap-5">
          <span class="flex items-center gap-1.5"><i data-lucide="map-pin" class="w-3.5 h-3.5 text-brand-300"></i> <span data-i18n="hospitalAddress"></span></span>
          <span class="flex items-center gap-1.5"><i data-lucide="phone" class="w-3.5 h-3.5 text-brand-300"></i> <span dir="ltr">+93 785 324 819</span></span>
          <span class="flex items-center gap-1.5"><i data-lucide="mail" class="w-3.5 h-3.5 text-brand-300"></i> info@ferdoushospital.com</span>
        </div>
        <div class="flex items-center gap-2 font-medium text-brand-100">
          <i data-lucide="clock" class="w-3.5 h-3.5"></i>
          <span data-i18n="hours24"></span>
        </div>
      </div>
    </div>

    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-4">
<!-- Brand -->
      <!-- ORIGINAL:
      <div class="flex items-center gap-3 cursor-pointer" onclick="switchMode('public')">
      -->
      <!-- === TEMPORARY TEST (START) - REMOVE AFTER TESTING === -->
      <div class="flex items-center gap-3 cursor-pointer select-none" ondblclick="handleLogoTestClick()">
      <!-- === TEMPORARY TEST (END) === -->
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-brand-600 to-teal-700 text-white flex items-center justify-center shadow-md shadow-brand-600/20">
          <i data-lucide="heart-pulse" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="text-base sm:text-lg font-extrabold text-slate-900 leading-tight" data-i18n="hospitalName"></h1>
          <p class="text-[11px] font-medium text-slate-500" data-i18n="hospitalTagline"></p>
        </div>
      </div>

      <!-- Mode Switcher & Language -->
      <div class="flex items-center gap-2 sm:gap-3">
        <div class="bg-slate-100 p-1 rounded-xl flex items-center border border-slate-200">
          <button id="btn-mode-public" onclick="switchMode('public')" class="px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold flex items-center gap-1.5 transition">
            <i data-lucide="globe" class="w-4 h-4"></i>
            <span data-i18n="modeWebsite"></span>
          </button>
          <button id="btn-mode-hms" onclick="switchMode('hms')" class="px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold flex items-center gap-1.5 transition">
            <i data-lucide="database" class="w-4 h-4"></i>
            <span data-i18n="modeHMS"></span>
          </button>
        </div>

        <button onclick="toggleLanguage()" class="px-3 py-2 rounded-xl border border-slate-200 hover:bg-slate-100 text-xs sm:text-sm font-bold text-slate-700 flex items-center gap-1.5 transition">
          <i data-lucide="languages" class="w-4 h-4 text-brand-600"></i>
          <span id="lang-label">English</span>
        </button>

        <button id="mobile-sidebar-btn" onclick="toggleMobileSidebar()" class="hidden lg:hidden p-2 rounded-xl border border-slate-200 text-slate-700">
          <i data-lucide="menu" class="w-5 h-5"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- ==================== PUBLIC WEBSITE VIEW ==================== -->
  <main id="view-public" class="fade-in">
    <!-- Hero Section -->
    <section class="relative overflow-hidden bg-gradient-to-br from-slate-900 via-brand-950 to-teal-900 text-white py-16 lg:py-24">
      <div class="absolute inset-0 opacity-10" style="background-image: radial-gradient(#34d399 1px, transparent 1px); background-size: 28px 28px;"></div>
      <div class="max-w-7xl mx-auto px-4 relative z-10 grid lg:grid-cols-12 gap-10 items-center">
        <div class="lg:col-span-7 space-y-6">
          <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-white/10 border border-white/20 text-brand-200 text-xs font-semibold backdrop-blur">
            <i data-lucide="shield-check" class="w-4 h-4"></i>
            <span data-i18n="heroBadge"></span>
          </div>
          <h2 class="text-3xl sm:text-5xl font-extrabold leading-tight tracking-tight" data-i18n="heroTitle"></h2>
          <p class="text-slate-200 text-base sm:text-lg max-w-2xl leading-relaxed" data-i18n="heroDesc"></p>

          <div class="flex flex-wrap gap-3 pt-2">
            <a href="#public-booking" class="px-6 py-3.5 rounded-xl bg-brand-500 hover:bg-brand-600 text-white font-bold text-sm flex items-center gap-2 shadow-lg shadow-brand-500/25 transition">
              <i data-lucide="calendar-plus" class="w-4 h-4"></i>
              <span data-i18n="bookAppointment"></span>
            </a>
            <a href="#public-lookup" class="px-6 py-3.5 rounded-xl bg-white/10 hover:bg-white/20 border border-white/20 text-white font-bold text-sm flex items-center gap-2 backdrop-blur transition">
              <i data-lucide="file-search" class="w-4 h-4"></i>
              <span data-i18n="checkResults"></span>
            </a>
            <button onclick="switchMode('hms')" class="px-6 py-3.5 rounded-xl bg-amber-500/90 hover:bg-amber-500 text-slate-950 font-bold text-sm flex items-center gap-2 transition">
              <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
              <span data-i18n="openDatabasePortal"></span>
            </button>
          </div>
        </div>

        <!-- Live Hospital Status Card -->
        <div class="lg:col-span-5">
          <div class="bg-white/10 backdrop-blur-xl border border-white/20 rounded-3xl p-6 space-y-5 shadow-2xl">
            <div class="flex items-center justify-between border-b border-white/15 pb-4">
              <div class="flex items-center gap-2.5">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                <span class="font-bold text-sm" data-i18n="liveStatusTitle"></span>
              </div>
              <span class="text-xs px-2.5 py-1 rounded-lg bg-red-500/20 border border-red-400/30 text-red-200 font-semibold flex items-center gap-1">
                <i data-lucide="siren" class="w-3.5 h-3.5"></i> 24/7 ER
              </span>
            </div>
            <div class="grid grid-cols-2 gap-4" id="public-live-stats"></div>
            <div class="bg-slate-950/40 rounded-2xl p-4 flex items-center justify-between text-xs">
              <div class="flex items-center gap-2 text-slate-200">
                <i data-lucide="map-pin" class="w-4 h-4 text-brand-400"></i>
                <span data-i18n="hospitalAddress"></span>
              </div>
              <span dir="ltr" class="font-bold text-brand-300">+93 785 324 819</span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Services Section -->
    <section class="py-16 max-w-7xl mx-auto px-4">
      <div class="text-center max-w-2xl mx-auto mb-12 space-y-2">
        <span class="text-xs font-bold uppercase tracking-wider text-brand-600" data-i18n="servicesSubtitle"></span>
        <h3 class="text-2xl sm:text-3xl font-extrabold text-slate-900" data-i18n="servicesTitle"></h3>
        <p class="text-slate-500 text-sm" data-i18n="servicesDesc"></p>
      </div>
      <div id="public-services-grid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </section>

    <!-- Specialists Directory -->
    <section class="py-16 bg-white border-y border-slate-200">
      <div class="max-w-7xl mx-auto px-4">
        <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4 mb-10">
          <div>
            <span class="text-xs font-bold uppercase tracking-wider text-brand-600" data-i18n="doctorsSubtitle"></span>
            <h3 class="text-2xl sm:text-3xl font-extrabold text-slate-900 mt-1" data-i18n="doctorsTitle"></h3>
          </div>
          <select id="public-doc-filter" onchange="renderPublicDoctors()" class="px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm font-medium outline-none focus:ring-2 focus:ring-brand-500"></select>
        </div>
        <div id="public-doctors-grid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
      </div>
    </section>

    <!-- Online Booking & Lab Result Lookup -->
    <section id="public-booking" class="py-16 max-w-7xl mx-auto px-4 grid lg:grid-cols-12 gap-8">
      <!-- Appointment Form -->
      <div class="lg:col-span-7 bg-white rounded-3xl border border-slate-200 p-6 sm:p-8 shadow-sm">
        <div class="flex items-center gap-3 mb-6">
          <div class="w-11 h-11 rounded-2xl bg-brand-50 text-brand-600 flex items-center justify-center">
            <i data-lucide="calendar-check" class="w-6 h-6"></i>
          </div>
          <div>
            <h3 class="text-xl font-extrabold text-slate-900" data-i18n="bookAppointment"></h3>
            <p class="text-xs text-slate-500" data-i18n="bookSubtitle"></p>
          </div>
        </div>
        <form id="public-book-form" onsubmit="handlePublicBooking(event)" class="grid sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1.5" data-i18n="fullName"></label>
            <input type="text" name="name" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-brand-500 outline-none" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1.5" data-i18n="phone"></label>
            <input type="text" name="phone" required placeholder="078XXXXXXX" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-brand-500 outline-none" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1.5" data-i18n="age"></label>
            <input type="number" name="age" min="0" max="120" value="30" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-brand-500 outline-none" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1.5" data-i18n="gender"></label>
            <select name="gender" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-brand-500 outline-none">
              <option value="Male" data-i18n="male"></option>
              <option value="Female" data-i18n="female"></option>
            </select>
          </div>
          <div class="sm:col-span-2">
            <label class="block text-xs font-bold text-slate-600 mb-1.5" data-i18n="selectDoctor"></label>
            <select id="public-book-doctor" name="doctorId" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-brand-500 outline-none"></select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1.5" data-i18n="date"></label>
            <input type="date" name="date" id="public-book-date" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-brand-500 outline-none" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1.5" data-i18n="time"></label>
            <input type="time" name="time" value="10:00" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-brand-500 outline-none" />
          </div>
          <div class="sm:col-span-2">
            <label class="block text-xs font-bold text-slate-600 mb-1.5" data-i18n="notesSymptoms"></label>
            <textarea name="notes" rows="2" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-brand-500 outline-none"></textarea>
          </div>
          <div class="sm:col-span-2">
            <button type="submit" class="w-full py-3 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold text-sm flex items-center justify-center gap-2 transition shadow-md shadow-brand-600/20">
              <i data-lucide="check-circle-2" class="w-4 h-4"></i>
              <span data-i18n="confirmBooking"></span>
            </button>
          </div>
        </form>
        <div id="public-booking-confirmation" class="hidden mt-4 p-4 rounded-2xl bg-emerald-50 border border-emerald-200 text-emerald-900 text-sm"></div>
      </div>

      <!-- Patient Report Lookup -->
      <div id="public-lookup" class="lg:col-span-5 bg-white rounded-3xl border border-slate-200 p-6 sm:p-8 shadow-sm flex flex-col justify-between">
        <div>
          <div class="flex items-center gap-3 mb-6">
            <div class="w-11 h-11 rounded-2xl bg-sky-50 text-sky-600 flex items-center justify-center">
              <i data-lucide="microscope" class="w-6 h-6"></i>
            </div>
            <div>
              <h3 class="text-xl font-extrabold text-slate-900" data-i18n="checkResults"></h3>
              <p class="text-xs text-slate-500" data-i18n="lookupSubtitle"></p>
            </div>
          </div>

          <div class="flex gap-2 mb-4">
            <input id="lookup-input" type="text" placeholder="FSH-1001 / 0781234567" class="flex-1 px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-sky-500 outline-none" />
            <button onclick="handlePublicLookup()" class="px-4 py-2.5 rounded-xl bg-sky-600 hover:bg-sky-700 text-white font-bold text-sm flex items-center gap-1.5 transition">
              <i data-lucide="search" class="w-4 h-4"></i>
              <span data-i18n="search"></span>
            </button>
          </div>
          <div id="lookup-results" class="space-y-3 max-h-80 overflow-y-auto custom-scroll">
            <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200 text-xs text-slate-500" data-i18n="lookupHint"></div>
          </div>
        </div>

        <!-- Kabul Location Info Box -->
        <div class="mt-6 p-4 rounded-2xl bg-slate-900 text-white space-y-2">
          <div class="flex items-center gap-2 font-bold text-sm text-brand-300">
            <i data-lucide="building-2" class="w-4 h-4"></i>
            <span data-i18n="hospitalName"></span>
          </div>
          <p class="text-xs text-slate-300 flex items-center gap-2"><i data-lucide="map-pin" class="w-3.5 h-3.5 text-brand-400 shrink-0"></i> <span data-i18n="hospitalAddress"></span></p>
          <p class="text-xs text-slate-300 flex items-center gap-2"><i data-lucide="phone-call" class="w-3.5 h-3.5 text-brand-400 shrink-0"></i> <span dir="ltr">+93 785 324 819</span></p>
          <p class="text-xs text-slate-300 flex items-center gap-2"><i data-lucide="mail" class="w-3.5 h-3.5 text-brand-400 shrink-0"></i> info@ferdoushospital.com</p>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="bg-slate-900 text-slate-400 py-8 border-t border-slate-800">
      <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs">
        <p class="font-medium text-slate-300" data-i18n="footerCopy"></p>
        <p data-i18n="hospitalAddress"></p>
      </div>
    </footer>
  </main>

  <!-- ==================== HMS DATABASE PORTAL VIEW ==================== -->
  <div id="view-hms" class="hidden fade-in min-h-[calc(100vh-4rem)] flex">
    <!-- Sidebar -->
    <aside id="hms-sidebar" class="fixed lg:static inset-y-0 start-0 z-30 w-64 bg-white border-e border-slate-200 flex flex-col transition-transform duration-200 -translate-x-full rtl:translate-x-full lg:translate-x-0 lg:rtl:translate-x-0 pt-16 lg:pt-0">
      <div class="p-4 border-b border-slate-100">
        <div class="text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-2" data-i18n="hmsModules"></div>
        <div class="relative">
          <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute top-2.5 start-3"></i>
          <input id="global-search" oninput="renderActiveTab()" type="text" class="w-full ps-9 pe-3 py-2 rounded-xl bg-slate-50 border border-slate-200 text-xs outline-none focus:ring-2 focus:ring-brand-500" />
        </div>
      </div>

      <nav id="hms-nav" class="flex-1 overflow-y-auto custom-scroll p-3 space-y-1"></nav>

      <div class="p-3 border-t border-slate-100 bg-slate-50/70 space-y-2">
        <div class="flex items-center justify-between text-[11px] text-slate-500 px-1">
          <span data-i18n="localSync"></span>
          <span class="flex items-center gap-1 text-emerald-600 font-bold"><i data-lucide="hard-drive" class="w-3 h-3"></i> JSON DB</span>
        </div>
        <div class="grid grid-cols-2 gap-1.5">
          <button onclick="exportDatabase()" class="px-2.5 py-1.5 rounded-lg bg-white border border-slate-200 hover:bg-slate-100 text-[11px] font-bold text-slate-700 flex items-center justify-center gap-1">
            <i data-lucide="download" class="w-3.5 h-3.5"></i> <span data-i18n="backup"></span>
          </button>
          <button onclick="confirmResetDatabase()" class="px-2.5 py-1.5 rounded-lg bg-white border border-rose-200 hover:bg-rose-50 text-[11px] font-bold text-rose-600 flex items-center justify-center gap-1">
            <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i> <span data-i18n="reset"></span>
          </button>
        </div>
      </div>
    </aside>

    <!-- Main Workspace -->
    <main class="flex-1 min-w-0 p-4 sm:p-6 lg:p-8 overflow-y-auto">
      <div id="hms-content" class="max-w-7xl mx-auto space-y-6"></div>
    </main>
  </div>

  <!-- ==================== MODAL & PRINT AREA ==================== -->
  <div id="modal-backdrop" class="hidden fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
    <div id="modal-box" class="bg-white rounded-3xl shadow-2xl border border-slate-200 w-full max-w-2xl overflow-hidden fade-in my-auto">
      <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/70">
        <h3 id="modal-title" class="text-base sm:text-lg font-extrabold text-slate-900"></h3>
        <button onclick="closeModal()" class="p-1.5 rounded-xl hover:bg-slate-200 text-slate-500 transition">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div id="modal-body" class="p-6 max-h-[78vh] overflow-y-auto custom-scroll"></div>
    </div>
  </div>

  <div id="print-area" class="hidden"></div>

    function t(key) {
      return (i18n[lang] && i18n[lang][key]) || key;
    }

    function locName(obj) {
      if (!obj) return '';
      return lang === 'fa' ? (obj.name_fa || obj.name_en || obj.name) : (obj.name_en || obj.name_fa || obj.name);
    }

    function locField(obj, base) {
      if (!obj) return '';
      return lang === 'fa' ? (obj[`${base}_fa`] || obj[`${base}_en`] || '') : (obj[`${base}_en`] || obj[`${base}_fa`] || '');
    }

    // ==================== INIT & API ====================
    async function initApp() {
      applyLanguageDOM();
      document.getElementById('public-book-date').value = new Date().toISOString().split('T')[0];
      await refreshDB();
      switchMode('public');
    }

async function refreshDB() {
      const res = await fetch('/api/db');
      // ORIGINAL: DB = await res.json();
      // === TEMPORARY TEST (START) - REMOVE AFTER TESTING ===
      RAW_DB = await res.json();
      applyTestViewFilter();
      // === TEMPORARY TEST (END) ===
      renderPublicAll();
      if (currentMode === 'hms') renderHMSAll();
      lucide.createIcons();
    }

    // === TEMPORARY TEST (START) - REMOVE AFTER TESTING ===
    let isReducedView = false;
    let RAW_DB = null;

    function halfSlice(arr) {
      return Array.isArray(arr) ? arr.slice(0, Math.ceil(arr.length * 0.5)) : [];
    }

    function applyTestViewFilter() {
      if (!RAW_DB) return;
      if (!isReducedView) {
        DB = RAW_DB;
      } else {
        // Only reduce patients, billing, lab tests & patient-related records to 50%
        // (doctors, beds, pharmacy, and staff stay at 100%)
        const patientAndBillingCols = [
          'patients',
          'appointments',
          'labTests',
          'radiology',
          'prescriptions',
          'invoices',
          'emergency'
        ];
        const copy = { ...RAW_DB };
        patientAndBillingCols.forEach(c => { copy[c] = halfSlice(RAW_DB[c]); });
        DB = copy;
      }
    }

    function handleLogoTestClick() {
      // Double-click toggles between 50% view and 100% view (no database changes)
      isReducedView = !isReducedView;
      applyTestViewFilter();
      renderPublicAll();
      if (currentMode === 'hms' && DB) renderHMSAll();
      lucide.createIcons();
    }
    // === TEMPORARY TEST (END) ===

    function toggleLanguage() {
      lang = lang === 'fa' ? 'en' : 'fa';
      localStorage.setItem('fsh_lang', lang);
      applyLanguageDOM();
      renderPublicAll();
      if (currentMode === 'hms') renderHMSAll();
      lucide.createIcons();
    }

    function applyLanguageDOM() {
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
      document.getElementById('lang-label').textContent = lang === 'fa' ? 'English' : 'دری';
      document.querySelectorAll('[data-i18n]').forEach(el => {
        el.textContent = t(el.getAttribute('data-i18n'));
      });
      const gs = document.getElementById('global-search');
      if (gs) gs.placeholder = t('searchPlaceholder');
    }

    function switchMode(mode) {
      currentMode = mode;
      const pubEl = document.getElementById('view-public');
      const hmsEl = document.getElementById('view-hms');
      const btnPub = document.getElementById('btn-mode-public');
      const btnHms = document.getElementById('btn-mode-hms');
      const mobBtn = document.getElementById('mobile-sidebar-btn');

      if (mode === 'public') {
        pubEl.classList.remove('hidden');
        hmsEl.classList.add('hidden');
        mobBtn.classList.add('hidden');
        btnPub.className = 'px-3 py-1.5 rounded-lg text-xs sm:text-sm font-bold flex items-center gap-1.5 bg-white text-brand-700 shadow-sm';
        btnHms.className = 'px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold flex items-center gap-1.5 text-slate-600 hover:text-slate-900';
        renderPublicAll();
      } else {
        pubEl.classList.add('hidden');
        hmsEl.classList.remove('hidden');
        mobBtn.classList.remove('hidden');
        btnHms.className = 'px-3 py-1.5 rounded-lg text-xs sm:text-sm font-bold flex items-center gap-1.5 bg-brand-600 text-white shadow-sm';
        btnPub.className = 'px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold flex items-center gap-1.5 text-slate-600 hover:text-slate-900';
        renderHMSAll();
      }
      lucide.createIcons();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function toggleMobileSidebar() {
      const sb = document.getElementById('hms-sidebar');
      sb.classList.toggle('-translate-x-full');
      sb.classList.toggle('rtl:translate-x-full');
    }

    // ==================== TOAST & MODALS ====================
    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const el = document.createElement('div');
      const colors = type === 'error'
        ? 'bg-rose-600 text-white border-rose-700'
        : 'bg-slate-900 text-white border-slate-800';
      const icon = type === 'error' ? 'alert-circle' : 'check-circle-2';
      el.className = `px-4 py-3 rounded-2xl border shadow-xl flex items-center gap-2.5 text-xs sm:text-sm font-semibold fade-in ${colors}`;
      el.innerHTML = `<i data-lucide="${icon}" class="w-4 h-4 shrink-0"></i><span>${message}</span>`;
      container.appendChild(el);
      lucide.createIcons();
      setTimeout(() => el.remove(), 3500);
    }

    function openModal(title, html, maxWidth = 'max-w-2xl') {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-body').innerHTML = html;
      const box = document.getElementById('modal-box');
      box.className = `bg-white rounded-3xl shadow-2xl border border-slate-200 w-full ${maxWidth} overflow-hidden fade-in my-auto`;
      document.getElementById('modal-backdrop').classList.remove('hidden');
      lucide.createIcons();
    }

    function closeModal() {
      document.getElementById('modal-backdrop').classList.add('hidden');
    }

    function openConfirmModal(message, onConfirm) {
      openModal(t('actions'), `
        <div class="space-y-5">
          <div class="flex items-start gap-3 p-4 rounded-2xl bg-rose-50 border border-rose-200 text-rose-800 text-sm">
            <i data-lucide="alert-triangle" class="w-5 h-5 shrink-0 mt-0.5"></i>
            <p>${message}</p>
          </div>
          <div class="flex justify-end gap-2">
            <button onclick="closeModal()" class="px-4 py-2 rounded-xl border border-slate-200 text-sm font-bold text-slate-600 hover:bg-slate-50">${t('cancel')}</button>
            <button id="confirm-yes-btn" class="px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-sm font-bold">${t('delete')} / OK</button>
          </div>
        </div>
      `, 'max-w-md');
      document.getElementById('confirm-yes-btn').onclick = async () => {
        closeModal();
        await onConfirm();
      };
    }

    async function handlePublicBooking(e) {
      e.preventDefault();
      const form = e.target;
      const payload = Object.fromEntries(new FormData(form).entries());
      const res = await fetch('/api/public/book', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!res.ok) return showToast(data.error || 'Error', 'error');

      const box = document.getElementById('public-booking-confirmation');
      box.classList.remove('hidden');
      box.innerHTML = `
        <div class="flex items-center gap-2 font-extrabold text-base mb-1">
          <i data-lucide="check-circle-2" class="w-5 h-5 text-emerald-600"></i>
          <span>${t('bookSuccessMsg')} <span class="px-2 py-0.5 rounded bg-emerald-600 text-white">${data.appointment.token}</span></span>
        </div>
        <p class="text-xs">${t('mrn')}: <strong>${data.patient.mrn}</strong> | ${data.appointment.doctorName} | ${data.appointment.date} (${data.appointment.time})</p>
      `;
      form.reset();
      document.getElementById('public-book-date').value = new Date().toISOString().split('T')[0];
      showToast(t('savedSuccess'));
      await refreshDB();
    }

    async function handlePublicLookup() {
      const q = document.getElementById('lookup-input').value.trim();
      const box = document.getElementById('lookup-results');
      if (!q) return;
      const res = await fetch(`/api/public/lookup?q=${encodeURIComponent(q)}`);
      const data = await res.json();
      if (!data.patient) {
        box.innerHTML = `<div class="p-4 rounded-2xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-semibold">${t('noResults')}</div>`;
        return;
      }
      box.innerHTML = `
        <div class="p-3.5 rounded-2xl bg-brand-50 border border-brand-200 text-xs space-y-1">
          <div class="font-extrabold text-brand-900">${locName(data.patient)} (${data.patient.mrn})</div>
          <div class="text-brand-700">${t('bloodGroup')}: ${data.patient.bloodGroup} | ${t('phone')}: ${data.patient.phone}</div>
        </div>
        ${data.labTests.map(l => `
          <div class="p-3.5 rounded-2xl bg-slate-50 border border-slate-200 text-xs space-y-1">

    function renderSidebar() {
      const lowStockCount = DB.pharmacy.filter(m => m.stock <= m.reorderLevel).length;
      const activeERCount = DB.emergency.filter(e => e.status === 'In ER').length;

      document.getElementById('hms-nav').innerHTML = HMS_TABS.map(tab => {
        const active = activeTab === tab.id;
        let badge = '';
        if (tab.id === 'pharmacy' && lowStockCount > 0) {
          badge = `<span class="px-1.5 py-0.5 rounded-full bg-rose-100 text-rose-700 text-[10px] font-bold">${lowStockCount}</span>`;
        }
        if (tab.id === 'emergency' && activeERCount > 0) {
          badge = `<span class="px-1.5 py-0.5 rounded-full bg-red-600 text-white text-[10px] font-bold">${activeERCount}</span>`;
        }
        return `
          <button onclick="selectTab('${tab.id}')" class="w-full px-3 py-2.5 rounded-xl text-xs font-bold flex items-center justify-between transition ${active ? 'bg-brand-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'}">

              <i data-lucide="${tab.icon}" class="w-4 h-4"></i>

        'Paid': 'bg-emerald-50 text-emerald-700 border-emerald-200',
        'Dispensed': 'bg-emerald-50 text-emerald-700 border-emerald-200',
        'On Duty': 'bg-emerald-50 text-emerald-700 border-emerald-200',
        'Available': 'bg-emerald-50 text-emerald-700 border-emerald-200',
        'Active': 'bg-emerald-50 text-emerald-700 border-emerald-200',
        'Discharged': 'bg-slate-100 text-slate-600 border-slate-200',
        'Checked-In': 'bg-sky-50 text-sky-700 border-sky-200',
        'In Progress': 'bg-sky-50 text-sky-700 border-sky-200',
        'Scheduled': 'bg-indigo-50 text-indigo-700 border-indigo-200',
        'Partial': 'bg-amber-50 text-amber-700 border-amber-200',
        'Pending': 'bg-amber-50 text-amber-700 border-amber-200',
        'In Surgery': 'bg-amber-50 text-amber-700 border-amber-200',
        'Urgent': 'bg-amber-50 text-amber-700 border-amber-200',
        'Occupied': 'bg-rose-50 text-rose-700 border-rose-200',
        'Unpaid': 'bg-rose-50 text-rose-700 border-rose-200',
        'Critical': 'bg-red-600 text-white border-red-700',
        'In ER': 'bg-red-50 text-red-700 border-red-200',
        'Cancelled': 'bg-slate-100 text-slate-500 border-slate-200',

      return `<span class="px-2.5 py-1 rounded-full border text-[11px] font-bold whitespace-nowrap ${cls}">${status}</span>`;

    function initDashboardCharts() {
      Object.values(charts).forEach(c => c && c.destroy());
      const deptCounts = {};
      DB.appointments.forEach(a => { deptCounts[a.department] = (deptCounts[a.department] || 0) + 1; });
      DB.doctors.forEach(d => { if (!deptCounts[d.department]) deptCounts[d.department] = 0; });

      const ctx1 = document.getElementById('chart-departments');
      if (ctx1) {
        charts.dept = new Chart(ctx1, {
          type: 'bar',
          data: {
            labels: Object.keys(deptCounts),
            datasets: [{
              label: t('todayAppointments'),
              data: Object.values(deptCounts),
              backgroundColor: '#059669',
              borderRadius: 8
            }]
          },
          options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
        });
      }

      const paid = DB.invoices.reduce((s, i) => s + Number(i.paidAmount || 0), 0);
      const total = DB.invoices.reduce((s, i) => s + Number(i.totalAmount || 0), 0);
      const due = Math.max(0, total - paid);

      const ctx2 = document.getElementById('chart-revenue');
      if (ctx2) {
        charts.rev = new Chart(ctx2, {
          type: 'doughnut',
          data: {
            labels: [t('paid'), t('unpaid')],
            datasets: [{
              data: [paid, due],
              backgroundColor: ['#10b981', '#f43f5e'],
              borderWidth: 0
            }]
          },
          options: { responsive: true, maintainAspectRatio: false }
        });
      }
    }

    async function saveInvoice(e) {
      e.preventDefault();
      const f = Object.fromEntries(new FormData(e.target).entries());
      const p = DB.patients.find(x => x.id === f.patientId);
      const amt = Number(f.amount);
      const disc = Number(f.discount) || 0;
      const total = Math.max(0, amt - disc);
      const paid = Number(f.paidAmount) || 0;
      const status = paid >= total ? 'Paid' : paid > 0 ? 'Partial' : 'Unpaid';
      await postRecord('invoices', {
        patientId: p.id, patientName: p.name_en,
        items: [{ description: f.desc, amount: amt }],
        discount: disc, totalAmount: total, paidAmount: paid,
        status, paymentMethod: 'Cash (AFN)'
      });
    }

    function printInvoice(id) {
      const inv = DB.invoices.find(x => x.id === id);

      area.classList.remove('hidden');
      area.innerHTML = `
        <div style="font-family:sans-serif; max-width:650px; margin:auto; border:1px solid #cbd5e1; padding:24px;">
          <h2 style="margin:0; color:#047857;">شفاخانه تخصصی فردوس | Ferdows Specialized Hospital</h2>
          <p style="font-size:12px; color:#475569;">Gulayee Dawa Khana, Kota Sangi, Kabul | +93 785 324 819</p>
          <hr/>
          <div style="display:flex; justify-content:space-between; margin:12px 0;">
            <div><strong>Invoice:</strong> ${inv.invoiceNo}<br/><strong>Patient:</strong> ${inv.patientName}</div>
            <div><strong>Date:</strong> ${inv.createdAt}<br/><strong>Status:</strong> ${inv.status}</div>
          </div>
          <table style="width:100%; border-collapse:collapse;" border="1" cellpadding="8">
            <tr style="background:#f8fafc;"><th align="left">Description</th><th align="right">Amount (AFN)</th></tr>

            <tr><td><strong>Discount</strong></td><td align="right">-${inv.discount}</td></tr>
            <tr><td><strong>Total</strong></td><td align="right"><strong>${inv.totalAmount} AFN</strong></td></tr>
            <tr><td><strong>Paid</strong></td><td align="right">${inv.paidAmount} AFN</td></tr>

      `;

      area.classList.add('hidden');
    }

    // ==================== 11. EMERGENCY ====================
    function renderEmergency() {
      const q = getQuery();
      const rows = DB.emergency.filter(e => !q || JSON.stringify(e).toLowerCase().includes(q));
      return `
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <h2 class="text-2xl font-extrabold text-slate-900">${t('tab_emergency')} (${rows.length})</h2>
          <button onclick="openEmergencyModal()" class="px-4 py-2.5 rounded-xl bg-red-600 hover:bg-red-700 text-white text-xs font-bold flex items-center gap-1.5 self-start">
            <i data-lucide="siren" class="w-4 h-4"></i> ${t('addNew')}
          </button>
        </div>
        <div class="grid md:grid-cols-2 gap-4">
          ${rows.map(er => `
            <div class="bg-white rounded-3xl border-2 ${er.triageLevel === 'Critical' ? 'border-red-500' : 'border-slate-200'} p-5 space-y-3">
              <div class="flex justify-between items-start">
                <div>
                  <h4 class="font-extrabold text-base text-slate-900">${er.patientName} (${er.age}y / ${er.gender})</h4>
                  <p class="text-xs text-slate-500">${er.bay} | ${er.phone}</p>
                </div>
                <div class="flex gap-1.5">${statusBadge(er.triageLevel)}${statusBadge(er.status)}</div>
              </div>
              <p class="text-xs font-semibold text-rose-700 bg-rose-50 p-2.5 rounded-xl">${er.chiefComplaint}</p>
              <div class="grid grid-cols-4 gap-2 text-center text-xs bg-slate-50 p-2.5 rounded-xl">
                <div><span class="text-slate-400 block">BP</span><strong>${er.vitals?.bp || '-'}</strong></div>
                <div><span class="text-slate-400 block">HR</span><strong>${er.vitals?.hr || '-'}</strong></div>
                <div><span class="text-slate-400 block">Temp</span><strong>${er.vitals?.temp || '-'}</strong></div>
                <div><span class="text-slate-400 block">SpO2</span><strong>${er.vitals?.spo2 || '-'}</strong></div>
              </div>
              <div class="flex justify-end gap-2">
                ${er.status === 'In ER' ? `<button onclick="quickUpdate('emergency','${er.id}',{status:'Discharged'})" class="px-3 py-1.5 rounded-xl bg-slate-900 text-white text-xs font-bold">${t('discharge')}</button>` : ''}
                <button onclick="deleteRecord('emergency','${er.id}')" class="p-1.5 rounded-lg hover:bg-rose-50 text-rose-600"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function openEmergencyModal() {
      openModal(t('tab_emergency'), `
        <form onsubmit="saveER(event)" class="grid sm:grid-cols-2 gap-3 text-xs">
          <div><label class="font-bold block mb-1">${t('fullName')}</label><input name="patientName" required class="w-full p-2.5 rounded-xl border border-slate-200"/></div>
          <div><label class="font-bold block mb-1">${t('phone')}</label><input name="phone" class="w-full p-2.5 rounded-xl border border-slate-200"/></div>
          <div><label class="font-bold block mb-1">${t('age')}</label><input type="number" name="age" value="35" class="w-full p-2.5 rounded-xl border border-slate-200"/></div>
          <div><label class="font-bold block mb-1">Triage Level</label>
            <select name="triageLevel" class="w-full p-2.5 rounded-xl border border-slate-200"><option>Critical</option><option selected>Urgent</option><option>Standard</option></select>
          </div>
          <div class="sm:col-span-2"><label class="font-bold block mb-1">Chief Complaint</label><input name="chiefComplaint" required class="w-full p-2.5 rounded-xl border border-slate-200"/></div>
          <div><label class="font-bold block mb-1">BP</label><input name="bp" value="120/80" class="w-full p-2.5 rounded-xl border border-slate-200"/></div>
          <div><label class="font-bold block mb-1">Heart Rate (bpm)</label><input name="hr" value="88" class="w-full p-2.5 rounded-xl border border-slate-200"/></div>
          <div><label class="font-bold block mb-1">Temp (C)</label><input name="temp" value="37.5" class="w-full p-2.5 rounded-xl border border-slate-200"/></div>
          <div><label class="font-bold block mb-1">SpO2</label><input name="spo2" value="98%" class="w-full p-2.5 rounded-xl border border-slate-200"/></div>
          <div class="sm:col-span-2 flex justify-end gap-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border border-slate-200 font-bold">${t('cancel')}</button>
            <button type="submit" class="px-5 py-2 rounded-xl bg-red-600 text-white font-bold">${t('save')}</button>
          </div>
        </form>
      `);
    }

    async function saveER(e) {
      e.preventDefault();
      const f = Object.fromEntries(new FormData(e.target).entries());
      await postRecord('emergency', {
        patientName: f.patientName, age: Number(f.age), gender: 'Male', phone: f.phone,
        triageLevel: f.triageLevel, chiefComplaint: f.chiefComplaint,
        vitals: { bp: f.bp, hr: f.hr, temp: f.temp, spo2: f.spo2 },
        bay: 'ER-Bay-01', status: 'In ER'
      });
    }

    // ==================== 12. STAFF ====================
    function renderStaff() {
      const q = getQuery();
      const rows = DB.staff.filter(s => !q || JSON.stringify(s).toLowerCase().includes(q));
      return `
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <h2 class="text-2xl font-extrabold text-slate-900">${t('tab_staff')} (${rows.length})</h2>
          <button onclick="openStaffModal()" class="px-4 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-xs font-bold flex items-center gap-1.5 self-start">
            <i data-lucide="plus" class="w-4 h-4"></i> ${t('addNew')}
          </button>
        </div>
        <div class="bg-white rounded-3xl border border-slate-200 overflow-hidden shadow-sm">
          <div class="overflow-x-auto">
            <table class="w-full text-xs">
              <thead class="bg-slate-50 border-b border-slate-200 text-slate-500 font-bold">
                <tr>
                  <th class="p-3.5 text-start">${t('fullName')}</th>
                  <th class="p-3.5 text-start">Role</th>
                  <th class="p-3.5 text-start">${t('department')}</th>
                  <th class="p-3.5 text-start">Shift</th>
                  <th class="p-3.5 text-start">${t('phone')}</th>
                  <th class="p-3.5 text-end">${t('actions')}</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100">
                ${rows.map(s => `
                  <tr>
                    <td class="p-3.5 font-bold text-slate-900">${locName(s)}</td>
                    <td class="p-3.5">${locField(s, 'role')}</td>
                    <td class="p-3.5">${s.department}</td>
                    <td class="p-3.5">${s.shift}</td>
                    <td class="p-3.5" dir="ltr">${s.phone}</td>
                    <td class="p-3.5 text-end"><button onclick="deleteRecord('staff','${s.id}')" class="p-1.5 rounded-lg hover:bg-rose-50 text-rose-600"><i data-lucide="trash-2" class="w-4 h-4"></i></button></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function openStaffModal() {
      openModal(t('addNew'), `
        <form onsubmit="saveRecord(event,'staff','')" class="grid sm:grid-cols-2 gap-4 text-xs">
          <div><label class="font-bold block mb-1">${t('nameFa')}</label><input name="name_fa" required class="w-full p-2.5 rounded-xl border border-slate-200"/></div>
          <div><label class="font-bold block mb-1">${t('nameEn')}</label><input name="name_en" required class="w-full p-2.5 rounded-xl border border-slate-200"/></div>
          <div><label class="font-bold block mb-1">Role (FA)</label><input name="role_fa" required class="w-full p-2.5 rounded-xl border border-slate-200"/></div>
          <div><label class="font-bold block mb-1">Role (EN)</label><input name="role_en" required class="w-full p-2.5 rounded-xl border border-slate-200"/></div>
          <div><label class="font-bold block mb-1">${t('department')}</label><input name="department" value="Nursing" class="w-full p-2.5 rounded-xl border border-slate-200"/></div>
          <div><label class="font-bold block mb-1">Shift</label><input name="shift" value="Morning (08:00 - 16:00)" class="w-full p-2.5 rounded-xl border border-slate-200"/></div>
          <div class="sm:col-span-2"><label class="font-bold block mb-1">${t('phone')}</label><input name="phone" class="w-full p-2.5 rounded-xl border border-slate-200"/></div>
          <input type="hidden" name="status" value="Active"/>
          <div class="sm:col-span-2 flex justify-end gap-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border border-slate-200 font-bold">${t('cancel')}</button>
            <button type="submit" class="px-5 py-2 rounded-xl bg-brand-600 text-white font-bold">${t('save')}</button>
          </div>
        </form>
      `);
    }

    // ==================== 13. SETTINGS & BACKUP ====================
    function renderSettings() {
      return `
        <h2 class="text-2xl font-extrabold text-slate-900">${t('tab_settings')}</h2>
        <div class="bg-white rounded-3xl border border-slate-200 p-6 space-y-6">
          <div>
            <h3 class="font-extrabold text-base text-slate-900">${t('dbStatsTitle')}</h3>
            <p class="text-xs text-slate-500 mt-1">hospital_database.json — Express Local Persistence</p>
          </div>
          <div class="flex flex-wrap gap-3">
            <button onclick="exportDatabase()" class="px-4 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-xs font-bold flex items-center gap-2">
              <i data-lucide="download" class="w-4 h-4"></i> ${t('exportBackup')}
            </button>
            <label class="cursor-pointer px-4 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold flex items-center gap-2">
              <i data-lucide="upload" class="w-4 h-4"></i> ${t('importBackup')}
              <input type="file" accept=".json" onchange="importDatabase(event)" class="hidden"/>
            </label>
            <button onclick="confirmResetDatabase()" class="px-4 py-2.5 rounded-xl border border-rose-300 bg-rose-50 hover:bg-rose-100 text-rose-700 text-xs font-bold flex items-center gap-2">
              <i data-lucide="rotate-ccw" class="w-4 h-4"></i> ${t('reset')}
            </button>
          </div>
        </div>
      `;
    }

    // ==================== GENERIC CRUD HELPERS ====================
    async function saveRecord(e, collection, id) {
      e.preventDefault();
      const payload = Object.fromEntries(new FormData(e.target).entries());
      ['age', 'fee', 'dailyRate', 'stock', 'reorderLevel', 'unitPrice', 'price'].forEach(numKey => {
        if (payload[numKey] !== undefined) payload[numKey] = Number(payload[numKey]);
      });

      if (id) {
        await fetch(`/api/${collection}/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
      } else {
        await fetch(`/api/${collection}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
      }
      closeModal();
      showToast(t('savedSuccess'));
      await refreshDB();
    }

    async function postRecord(collection, payload) {
      await fetch(`/api/${collection}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      closeModal();
      showToast(t('savedSuccess'));
      await refreshDB();
    }

    async function quickUpdate(collection, id, patch) {
      await fetch(`/api/${collection}/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(patch)
      });
      showToast(t('savedSuccess'));
      await refreshDB();
    }

    function deleteRecord(collection, id) {
      openConfirmModal(t('confirmDelete'), async () => {
        await fetch(`/api/${collection}/${id}`, { method: 'DELETE' });
        showToast(t('deletedSuccess'));
        await refreshDB();
      });
    }

    function exportDatabase() {
      window.location.href = '/api/export-db';
    }

    async function importDatabase(e) {
      const file = e.target.files[0];
      if (!file) return;
      const text = await file.text();
      const json = JSON.parse(text);
      const res = await fetch('/api/import-db', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(json)
      });
      if (!res.ok) return showToast('Invalid JSON file', 'error');
      showToast(t('savedSuccess'));
      await refreshDB();
    }

    function confirmResetDatabase() {
      openConfirmModal(t('confirmResetMsg'), async () => {
        await fetch('/api/reset-db', { method: 'POST' });
        showToast(t('savedSuccess'));
        await refreshDB();
      });
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
